/* =========================================
   NORMALIZAR
========================================= */

function normalizar(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}


/* =========================================

/* =========================================
   CALCULADORA
========================================= */

function calcularExpressao(texto){

    let exp =
    texto

    .replace(/quanto e/gi,"")
    .replace(/quanto é/gi,"")
    .replace(/calcule/gi,"")
    .replace(/calcular/gi,"")
    .replace(/=/g,"")
    .replace(/,/g,".")
    .trim();


    if(
        !/^[0-9+\-*/().%\s^]+$/.test(exp)
    ){

        return null;

    }


    try{

        exp =
        exp.replace(/\^/g,"**");


        const resultado =
        Function(
            '"use strict"; return (' +
            exp +
            ')'
        )();


        if(
            typeof resultado !== "number" ||
            !isFinite(resultado)
        ){

            return null;

        }


        return resultado;

    }

    catch{

        return null;

    }

}


/* =========================================
   PORCENTAGEM
========================================= */

function porcentagem(texto){

    const m =
    texto.match(
        /([0-9.,]+)\s*%\s*(?:de)\s*([0-9.,]+)/i
    );


    if(!m){

        return null;

    }


    const p =
    parseFloat(
        m[1].replace(",",".")
    );


    const n =
    parseFloat(
        m[2].replace(",",".")
    );


    return (p / 100) * n;

}


/* =========================================
   MÉDIA
========================================= */

function media(texto){

    const numeros =
    texto.match(
        /-?\d+(?:[.,]\d+)?/g
    );


    if(
        !numeros ||
        numeros.length < 2
    ){

        return null;

    }


    const valores =
    numeros.map(
        x =>
        parseFloat(
            x.replace(",",".")
        )
    );


    return valores.reduce(
        (a,b) => a+b,
        0
    ) / valores.length;

}


/* =========================================
   REGRA DE TRÊS
========================================= */

function regraDeTres(texto){

    const nums =
    texto.match(
        /-?\d+(?:[.,]\d+)?/g
    );


    if(
        !nums ||
        nums.length !== 3
    ){

        return null;

    }


    const a =
    parseFloat(
        nums[0].replace(",",".")
    );


    const b =
    parseFloat(
        nums[1].replace(",",".")
    );


    const c =
    parseFloat(
        nums[2].replace(",",".")
    );


    if(a === 0){

        return null;

    }


    return (b*c)/a;

}


/* =========================================
   CONVERSÕES
========================================= */

function conversao(texto){

    let n;


    n =
    texto.match(
        /([0-9.,]+)\s*km.*m/i
    );


    if(n){

        return (

            parseFloat(
                n[1].replace(",",".")
            ) * 1000

        ) + " metros";

    }


    n =
    texto.match(
        /([0-9.,]+)\s*m.*km/i
    );


    if(n){

        return (

            parseFloat(
                n[1].replace(",",".")
            ) / 1000

        ) + " km";

    }


    n =
    texto.match(
        /([0-9.,]+)\s*h.*min/i
    );


    if(n){

        return (

            parseFloat(
                n[1].replace(",",".")
            ) * 60

        ) + " minutos";

    }


    n =
    texto.match(
        /([0-9.,]+)\s*min.*seg/i
    );


    if(n){

        return (

            parseFloat(
                n[1].replace(",",".")
            ) * 60

        ) + " segundos";

    }


    n =
    texto.match(
        /([0-9.,]+)\s*c.*f/i
    );


    if(n){

        const c =
        parseFloat(
            n[1].replace(",",".")
        );


        return (

            (c*9/5)+32

        ) + " °F";

    }


    n =
    texto.match(
        /([0-9.,]+)\s*f.*c/i
    );


    if(n){

        const f =
        parseFloat(
            n[1].replace(",",".")
        );


        return (

            (f-32)*5/9

        ) + " °C";

    }


    return null;

}

/* =========================================
   RESPOSTA INTELIGENTE
========================================= */

function respostaInteligente(pergunta){

    const p =
    normalizar(pergunta);


    /* SAUDAÇÕES */

    if(

        p === "oi" ||
        p === "ola" ||
        p.includes("bom dia") ||
        p.includes("boa tarde") ||
        p.includes("boa noite")

    ){

        return "Olá! 👋 Eu sou a WpX AI. Pode mandar sua pergunta.";

    }


    /* IDENTIDADE */

    if(

        p.includes("quem e voce") ||
        p.includes("quem e vc") ||
        p.includes("seu nome")

    ){

        return "Eu sou a WpX AI 🤖. Posso responder perguntas, explicar assuntos, fazer cálculos e muito mais.";

    }


    /* AJUDA */

    if(

        p === "ajuda" ||
        p.includes("o que voce sabe") ||
        p.includes("o que consegue fazer")

    ){

        return "Pode perguntar sobre matemática, ciências, história, geografia, programação, português, conversões e conhecimentos gerais.";

    }


    /* AGRADECIMENTOS */

    if(

        p.includes("obrigado") ||
        p.includes("obrigada") ||
        p.includes("valeu")

    ){

        return "De nada! 😎";

    }


    /* COMO ESTÁ */

    if(

        p.includes("tudo bem") ||
        p.includes("como voce esta")

    ){

        return "Estou funcionando perfeitamente 😎";

    }


    /* PI */

    if(

        p === "pi" ||
        p.includes("valor de pi") ||
        p.includes("quanto vale pi") ||
        p.includes("numero pi")

    ){

        return "π começa assim: 3,14159265358979323846... É um número irracional, então seus algarismos continuam indefinidamente.";

    }


    /* PORCENTAGEM */

    if(

        p.includes("%") &&
        p.includes("de")

    ){

        const r =
        porcentagem(p);


        if(r !== null){

            return `O resultado é ${r}.`;

        }

    }


    /* REGRA DE TRÊS */

    if(
        p.includes("regra de tres")
    ){

        const r =
        regraDeTres(p);


        if(r !== null){

            return `Pela regra de três, o resultado é ${r}.`;

        }

    }


    /* MÉDIA */

    if(
        p.includes("media de")
    ){

        const r =
        media(p);


        if(r !== null){

            return `A média aritmética é ${r}.`;

        }

    }


    /* CONVERSÕES */

    const conv =
    conversao(p);


    if(conv){

        return conv;

    }


    /* EQUAÇÃO */

    const eq =
    p.match(
        /x\s*\+\s*(-?\d+(?:[.,]\d+)?)\s*=\s*(-?\d+(?:[.,]\d+)?)/i
    );


    if(eq){

        const b =
        parseFloat(
            eq[1].replace(",",".")
        );


        const c =
        parseFloat(
            eq[2].replace(",",".")
        );


        return `x = ${c-b}`;

    }


    /* BASE DE CONHECIMENTO */

    for(
        const item of conhecimento
    ){

        for(
            const palavra of item.palavras
        ){

            if(

                p.includes(
                    normalizar(palavra)
                )

            ){

                return item.resposta;

            }

        }

    }


    /* MATEMÁTICA */

    const resultado =
    calcularExpressao(p);


    if(resultado !== null){

        return `O resultado é ${resultado}.`;

    }


    /* NÃO ENCONTRADO */

    return "Ainda não encontrei uma resposta específica para essa pergunta na minha base local. Tente perguntar de outra forma.";

}


/* =========================================
   PERGUNTAR
========================================= */

function perguntar(texto){

    input.value =
    texto;

    input.focus();

    enviar();

}


/* =========================================
   BOTÃO LOADING
========================================= */

function ativarBotao(){

    processando = true;

    sendButton.disabled = true;

    sendButton.style.opacity =
    ".6";

    sendButton.innerHTML =
    "⋯";

}


function desativarBotao(){

    processando = false;

    sendButton.disabled = false;

    sendButton.style.opacity =
    "1";

    sendButton.innerHTML =
    "➤";

}


/* =========================================
   ENVIAR
========================================= */

function enviar(){

    if(processando){

        return;

    }


    const pergunta =
    input.value.trim();


    if(!pergunta){

        input.focus();

        return;

    }


    mostrar(
        pergunta,
        "user"
    );


    historico.push({

        usuario:
        pergunta

    });


    input.value =
    "";


    ativarBotao();

    mostrarDigitando();


    /* SIMULA PROCESSAMENTO */

    const tempo =
    Math.min(
        900,
        Math.max(
            350,
            pergunta.length * 15
        )
    );


    setTimeout(()=>{

        removerDigitando();


        const resposta =
        respostaInteligente(
            pergunta
        );


        mostrar(
            resposta,
            "bot"
        );


        historico.push({

            ia:
            resposta

        });


        desativarBotao();


        input.focus();


    },tempo);

}


/* =========================================
   ENTER
========================================= */

input.addEventListener(

    "keydown",

    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviar();

        }

    }

);


/* =========================================
   RIPPLE NOS BOTÕES
========================================= */

document.addEventListener(

    "click",

    function(event){

        const button =
        event.target.closest("button");


        if(!button){

            return;

        }


        const circle =
        document.createElement("span");


        circle.className =
        "ripple";


        const rect =
        button.getBoundingClientRect();


        const size =
        Math.max(
            rect.width,
            rect.height
        );


        circle.style.width =
        size + "px";


        circle.style.height =
        size + "px";


        circle.style.left =
        (
            event.clientX -
            rect.left -
            size / 2
        ) + "px";


        circle.style.top =
        (
            event.clientY -
            rect.top -
            size / 2
        ) + "px";


        button.style.position =
        "relative";


        button.style.overflow =
        "hidden";


        button.appendChild(
            circle
        );


        setTimeout(()=>{

            circle.remove();

        },500);

    }

);
