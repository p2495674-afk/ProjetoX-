<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swh AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050507;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:900px;
    margin:auto;
    background:#08080b;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    padding:12px 18px;
    border-bottom:1px solid #241331;
    background:linear-gradient(135deg,#09070d,#160c20);
}

.logo{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    font-weight:bold;
    background:linear-gradient(135deg,#4d176d,#a84cff);
    box-shadow:0 0 25px #7d32a955;
    margin-right:12px;
}

.info h1{
    font-size:19px;
}

.status{
    font-size:12px;
    color:#b77aff;
    margin-top:3px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px 15px 130px;
}

.welcome{
    text-align:center;
    margin-top:12vh;
    padding:20px;
}

.welcome .big{
    font-size:55px;
    margin-bottom:15px;
}

.welcome h2{
    font-size:27px;
    margin-bottom:10px;
}

.welcome p{
    color:#999;
    line-height:1.5;
}

.message{
    display:flex;
    margin:14px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:82%;
    padding:13px 16px;
    border-radius:18px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.ai .bubble{
    background:#151019;
    border:1px solid #30203b;
    border-bottom-left-radius:5px;
}

.user .bubble{
    background:linear-gradient(135deg,#5c1d7d,#8d3dcc);
    border-bottom-right-radius:5px;
}

.typing{
    display:inline-flex;
    gap:4px;
}

.typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#b96cff;
    animation:pulse 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes pulse{
    0%,100%{opacity:.3}
    50%{opacity:1}
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(900px,100%);
    padding:10px 12px 14px;
    background:linear-gradient(transparent,#08080b 25%);
}

.quick{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:9px;
}

.quick button{
    flex:none;
    border:1px solid #382044;
    background:#120d17;
    color:#c997ff;
    padding:8px 12px;
    border-radius:14px;
    font-size:12px;
}

.input-area{
    display:flex;
    gap:8px;
    background:#100c13;
    border:1px solid #392047;
    border-radius:18px;
    padding:7px;
}

textarea{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:10px;
    font-family:inherit;
    font-size:15px;
    max-height:100px;
}

.send{
    width:46px;
    height:46px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#6b248e,#a64dff);
    color:white;
    font-size:20px;
}

.send:active{
    transform:scale(.95);
}

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-thumb{
    background:#40204e;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">S</div>

    <div class="info">
        <h1>Swh AI</h1>
        <div class="status">● Online</div>
    </div>
</header>

<main class="chat" id="chat">

    <div class="welcome" id="welcome">
        <div class="big">✦</div>
        <h2>Olá! Eu sou a Swh AI.</h2>
        <p>
            Pergunte qualquer coisa.<br>
            Matemática, programação, estudos, ideias,
            explicações e muito mais.
        </p>
    </div>

</main>

<div class="bottom">

    <div class="quick">
        <button onclick="quick('Explique matemática de forma simples')">
            🧮 Matemática
        </button>

        <button onclick="quick('Me explique programação para iniciantes')">
            💻 Programação
        </button>

        <button onclick="quick('Me conte uma curiosidade interessante')">
            💡 Curiosidade
        </button>

        <button onclick="quick('Me ajude a estudar')">
            📚 Estudos
        </button>
    </div>

    <div class="input-area">
        <textarea
            id="input"
            rows="1"
            placeholder="Pergunte qualquer coisa..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">
            ➤
        </button>
    </div>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

let history = [];

function addMessage(text,type){

    const welcome = document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const row = document.createElement("div");
    row.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    row.appendChild(bubble);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
}

function showTyping(){

    const row = document.createElement("div");
    row.className = "message ai";
    row.id = "typing";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = `
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    row.appendChild(bubble);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){

    const typing = document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}

async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    addMessage(text,"user");

    input.value = "";
    input.style.height = "auto";

    history.push({
        role:"user",
        content:text
    });

    showTyping();

    try{

        const response = await fetch(
            "COLOQUE_AQUI_A_URL_DO_SEU_BACKEND",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:text,
                    history:history
                })
            }
        );

        const data = await response.json();

        removeTyping();

        if(data.error){

            addMessage(
                "Erro: " + data.error,
                "ai"
            );

            return;
        }

        const answer = data.reply || "Não consegui responder agora.";

        addMessage(answer,"ai");

        history.push({
            role:"assistant",
            content:answer
        });

    }catch(error){

        removeTyping();

        addMessage(
            "Não consegui conectar ao servidor da Swh AI. Verifique o backend.",
            "ai"
        );

        console.error(error);
    }
}

function quick(text){

    input.value = text;
    sendMessage();

}

function handleKey(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        sendMessage();
    }
}

input.addEventListener("input",function(){

    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight,100) + "px";

});

</script>

</body>
</html>
